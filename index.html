<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shipe</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            justify-content: center;
        }
        h1 {
            color: #06b6d4;
            font-size: 2.2rem;
            margin: 0 0 20px 0;
            text-shadow: 0 0 15px rgba(6,182,212,0.6);
            letter-spacing: 2px;
        }
        #gameInterface {
            display: flex;
            gap: 25px;
            background: linear-gradient(145deg, #111827, #0f172a);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #1f2937;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        #spaceField {
            position: relative;
            width: 500px;
            height: 500px;
            background-color: #090d16;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            border: 2px solid #374151;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        #playerShip {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #06b6d4;
            border-radius: 50% 50% 15% 15%;
            box-shadow: 0 0 20px #06b6d4, inset 0 -5px 5px rgba(0,0,0,0.3);
            z-index: 5;
        }
        .wing-mount {
            position: absolute;
            width: 12px;
            height: 16px;
            background: linear-gradient(to bottom, #c084fc, #a855f7);
            top: 18px;
            border-radius: 4px;
            box-shadow: 0 0 8px #a855f7;
        }
        #leftWing { left: -10px; }
        #rightWing { right: -10px; }
        
        .enemy {
            position: absolute;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #f87171, #ef4444);
            border-radius: 6px;
            box-shadow: 0 0 12px #ef4444;
            transform: rotate(45deg);
            z-index: 4;
        }
        .laser {
            position: absolute;
            width: 6px;
            height: 14px;
            background-color: #4ade80;
            border-radius: 99px;
            box-shadow: 0 0 10px #22c55e;
            z-index: 3;
        }
        #controlBay {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .stat-panel {
            background-color: #1f2937;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .stat-line { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .stat-val { font-weight: bold; }
        .upgrade-btn {
            width: 100%;
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .upgrade-btn:hover:not(:disabled) { 
            background: linear-gradient(to bottom, #2563eb, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(59, 130, 246, 0.3);
        }
        .upgrade-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        .upgrade-btn:disabled { 
            background: #374151; 
            color: #6b7280; 
            cursor: not-allowed;
            box-shadow: none;
        }
        #gameOverOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(3, 7, 18, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <h1>🚀 STARSHIP GUARDIAN MATRIX</h1>

    <div id="gameInterface">
        <div id="spaceField">
            <div id="playerShip">
                <div id="leftWing" class="wing-mount" style="display:none;"></div>
                <div id="rightWing" class="wing-mount" style="display:none;"></div>
            </div>
            
            <div id="gameOverOverlay">
                <h2 style="color:#ef4444; font-size:2.2rem; margin-bottom:10px; letter-spacing: 1px;">CORE CRITICAL</h2>
                <p style="color:#9ca3af; margin-bottom:25px; font-size:1.1rem;">Command Ship Destroyed</p>
                <button class="upgrade-btn" style="width:160px;" onclick="window.location.reload()">REDEPLOY</button>
            </div>
        </div>

        <div id="controlBay">
            <div class="stat-panel">
                <div class="stat-line"><span>Crystals:</span><span id="txtCrystals" class="stat-val" style="color:#eab308;">30</span></div>
                <div class="stat-line"><span>Hull Integrity:</span><span id="txtHP" class="stat-val" style="color:#ef4444;">100%</span></div>
                <div class="stat-line"><span>Sector Wave:</span><span id="txtWave" class="stat-val" style="color:#22c55e;">1</span></div>
            </div>

            <button class="upgrade-btn" id="btnGatling" onclick="upgradeWeapon('gatling')">Mount Gatling (Cost: 30)</button>
            <button class="upgrade-btn" id="btnFlak" onclick="upgradeWeapon('flak')">Mount Flak (Cost: 75)</button>
            <button class="upgrade-btn" id="btnHull" onclick="upgradeWeapon('hull')">Reinforce Hull (Cost: 40)</button>

            <p style="font-size:0.85rem; color:#6b7280; margin-top:auto; text-align:center; line-height: 1.4;">
                Move ship with <span style="background:#1f2937; padding:2px 6px; border-radius:4px; color:#f3f4f6;">W A S D</span> or <span style="background:#1f2937; padding:2px 6px; border-radius:4px; color:#f3f4f6;">Arrows</span>.<br>
                <span style="color: #4ade80;">Weapons track targets automatically.</span>
            </p>
        </div>
    </div>

    <script>
        const field = document.getElementById('spaceField');
        const shipEl = document.getElementById('playerShip');
        
        let state = {
            running: true, crystals: 30, hp: 100, wave: 1,
            ship: { x: 230, y: 380, speed: 6 },
            weapons: { gatling: 0, flak: 0 },
            costs: { gatling: 30, flak: 75, hull: 40 },
            keys: {}, lastGatling: 0, lastFlak: 0
        };

        let entities = { enemies: [], lasers: [] };

        window.addEventListener('keydown', e => state.keys[e.code] = true);
        window.addEventListener('keyup', e => state.keys[e.code] = false);

        function upgradeWeapon(type) {
            if (state.crystals >= state.costs[type]) {
                state.crystals -= state.costs[type];
                if (type === 'hull') {
                    state.hp = Math.min(100, state.hp + 40);
                    state.costs.hull = Math.floor(state.costs.hull * 1.5);
                } else {
                    state.weapons[type]++;
                    state.costs[type] = Math.floor(state.costs[type] * 1.7);
                    if (type === 'gatling') document.getElementById('leftWing').style.display = 'block';
                    if (type === 'flak') document.getElementById('rightWing').style.display = 'block';
                }
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('txtCrystals').innerText = state.crystals;
            document.getElementById('txtHP').innerText = state.hp + '%';
            document.getElementById('txtWave').innerText = state.wave;
            
            document.getElementById('btnGatling').innerText = state.weapons.gatling > 0 ? `Upgrade Gatling (${state.costs.gatling})` : `Mount Gatling (${state.costs.gatling})`;
            document.getElementById('btnGatling').disabled = state.crystals < state.costs.gatling;
            
            document.getElementById('btnFlak').innerText = state.weapons.flak > 0 ? `Upgrade Flak (${state.costs.flak})` : `Mount Flak (${state.costs.flak})`;
            document.getElementById('btnFlak').disabled = state.crystals < state.costs.flak;
            
            document.getElementById('btnHull').innerText = `Reinforce Hull (${state.costs.hull})`;
            document.getElementById('btnHull').disabled = state.crystals < state.costs.hull;
        }

        function spawnEnemyWave() {
            if (!state.running) return;
            let count = 3 + state.wave * 2;
            for(let i=0; i<count; i++) {
                setTimeout(() => {
                    if (!state.running) return;
                    let el = document.createElement('div');
                    el.className = 'enemy';
                    el.style.left = Math.random() * 460 + 'px';
                    el.style.top = '-30px';
                    field.appendChild(el);
