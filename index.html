<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Simulator</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        #gameContainer {
            position: relative;
            width: 600px;
            height: 450px;
            margin: 10px auto;
            border: 4px solid #38bdf8;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            border-radius: 8px;
        }
        canvas {
            display: block;
            background: transparent;
        }
        .controls {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .key {
            background-color: #334155;
            color: #f8fafc;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #475569;
        }
    </style>
</head>
<body>

    <h1>SKY FIGHTER</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="450"></canvas>
    </div>

    <div class="controls">
        <span class="key">←</span> <span class="key">→</span> to Move | <span class="key">SPACEBAR</span> to Shoot Bullets
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Entities
        const player = {
            x: 275,
            y: 380,
            width: 40,
            height: 35,
            speed: 6,
            score: 0,
            health: 100
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let gameActive = true;
        let keys = {};

        // Track Controls
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function spawnEnemy() {
            if (!gameActive) return;
            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -40,
                width: 35,
                height: 30,
                speed: 2 + Math.random() * 3
            });
            // Schedule next enemy spawn randomly
            setTimeout(spawnEnemy, 1000 + Math.random() * 1500);
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    alpha: 1,
                    color: Math.random() > 0.5 ? '#f97316' : '#ef4444'
                });
            }
        }

        function update() {
            if (!gameActive) return;

            // Player movement
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += player.speed;
            
            // Shooting limits throttle
            if (keys['Space'] && (bullets.length === 0 || bullets[bullets.length - 1].y < player.y - 20)) {
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, speed: 8 });
                keys['Space'] = false; // Require tap or delay
            }

            // Move bullets
            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(index, 1);
            });

            // Move enemies
            enemies.forEach((e, eIdx) => {
                e.y += e.speed;
                
                // Check edge crash loss condition
                if (e.y > canvas.height) {
                    enemies.splice(eIdx, 1);
                    player.health -= 20;
                    if (player.health <= 0) gameActive = false;
                }

                // Check collision with player plane
                if (e.x < player.x + player.width &&
                    e.x + e.width > player.x &&
                    e.y < player.y + player.height &&
                    e.y + e.height > player.y) {
                    enemies.splice(eIdx, 1);
                    createExplosion(e.x + 15, e.y + 15);
                    player.health -= 34;
                    if (player.health <= 0) gameActive = false;
                }

                // Bullet hit validation checks
                bullets.forEach((b, bIdx) => {
                    if (b.x < e.x + e.width &&
                        b.x + 4 > e.x &&
                        b.y < e.y + e.height &&
                        b.y + 8 > e.y) {
                        createExplosion(e.x + 15, e.y + 15);
                        enemies.splice(eIdx, 1);
                        bullets.splice(bIdx, 1);
                        player.score += 100;
                    }
                });
            });

            // Manage explosion particles fading
            particles.forEach((p, pIdx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(pIdx, 1);
            });
        }

        function drawPlane(x, y, color, isPlayer) {
            ctx.fillStyle = color;
            ctx.beginPath();
            if (isPlayer) {
                // Retro Fighter Plane Vector Design
                ctx.moveTo(x + 20, y); // Nose
                ctx.lineTo(x + 35, y + 25); // Right wing tip
                ctx.lineTo(x + 25, y + 25);
                ctx.lineTo(x + 20, y + 35); // Tail
                ctx.lineTo(x + 15, y + 25);
                ctx.lineTo(x + 5, y + 25); // Left wing tip
            } else {
                // Enemy Attacker downward wing profile
                ctx.moveTo(x + 17, y + 30); // Nose down
                ctx.lineTo(x + 35, y + 5); 
                ctx.lineTo(x + 22, y + 5);
                ctx.lineTo(x + 17, y); // Tail up
                ctx.lineTo(x + 12, y + 5);
                ctx.lineTo(x, y + 5);
            }
            ctx.closePath();
            ctx.fill();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameActive) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.font = '24px "Courier New"';
                ctx.fillText("🚨 MISSION FAILED 🚨", 170, 200);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`FINAL SCORE: ${player.score}`, 200, 240);
                ctx.font = '14px "Courier New"';
                ctx.fillText("Refresh browser page to deploy again.", 160, 280);
                return;
            }

            // Draw game metrics panels
            ctx.fillStyle = '#38bdf8';
            ctx.font = '14px "Courier New"';
            ctx.fillText(`SCORE: ${player.score}`, 20, 30);
            ctx.fillStyle = player.health > 40 ? '#22c55e' : '#ef4444';
            ctx.fillText(`ARMOR: ${Math.max(0, player.health)}%`, 470, 30);

            // Draw player model
            drawPlane(player.x, player.y, '#38bdf8', true);

            // Draw active bullets
            ctx.fillStyle = '#fbbf24';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, 4, 10));

            // Draw active enemies
            enemies.forEach(e => drawPlane(e.x, e.y, '#f43f5e', false));

            // Draw fading particles 
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.restore();
            });
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Initialize game deployment
        spawnEnemy();
        gameLoop();
    </script>
</body>
</html>
