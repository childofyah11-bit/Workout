<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>\Defense</title>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
            user-select: none;
            overflow: hidden;
        }
        h1 {
            color: #06b6d4;
            font-size: 2rem;
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }
        #uiContainer {
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 900px;
            margin: 5px auto;
        }
        #gameBounds {
            position: relative;
            width: 600px;
            height: 480px;
            border: 3px solid #1f2937;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #shopPanel {
            width: 260px;
            background-color: #111827;
            border: 3px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .shop-title {
            color: #eab308;
            font-weight: bold;
            border-bottom: 1px solid #374151;
            padding-bottom: 5px;
            font-size: 1.1rem;
        }
        .shop-item {
            background-color: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-details { font-size: 0.85rem; color: #9ca3af; }
        .shop-name { color: #f3f4f6; font-weight: bold; }
        .btn-buy {
            background-color: #06b6d4;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .btn-buy:hover { background-color: #0891b2; }
        .btn-buy:disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; }
        .controls-hint {
            margin-top: 8px;
            color: #6b7280;
            font-size: 0.85rem;
        }
        .key {
            background-color: #1f2937;
            padding: 2px 6px;
            border-radius: 4px;
            color: #f3f4f6;
        }
    </style>
</head>
<body>

    <h1>🚀 STARSHIP GUARDIAN</h1>
    
    <div id="uiContainer">
        <div id="gameBounds">
            <canvas id="canvas" width="600" height="480"></canvas>
        </div>
        
        <div id="shopPanel">
            <div class="shop-title">💎 UPGRADE BAY (Crystals: <span id="crystalCount">0</span>)</div>
            
            <div class="shop-item">
                <div>
                    <div class="shop-name">Gatling Plasma</div>
                    <div class="shop-details" id="gatlingDesc">Level 0: Rapid Fire</div>
                </div>
                <button class="btn-buy" id="btnGatling" onclick="buyWeapon('gatling')">Buy: 50</button>
            </div>

            <div class="shop-item">
                <div>
                    <div class="shop-name">Flak Cannon</div>
                    <div class="shop-details" id="flakDesc">Level 0: AoE Explosions</div>
                </div>
                <button class="btn-buy" id="btnFlak" onclick="buyWeapon('flak')">Buy: 120</button>
            </div>

            <div class="shop-item">
                <div>
                    <div class="shop-name">EMP Tesla Beam</div>
                    <div class="shop-details" id="empDesc">Level 0: Chaining Arc</div>
                </div>
                <button class="btn-buy" id="btnEmp" onclick="buyWeapon('emp')">Buy: 200</button>
            </div>
            
            <div style="font-size:0.85rem; color:#a1a1aa; margin-top:auto;">
                <strong>Core Health:</strong> <span id="hpText" style="color:#ef4444; font-weight:bold;">100%</span><br>
                <strong>Sector Wave:</strong> <span id="waveText" style="color:#22c55e; font-weight:bold;">1</span>
            </div>
        </div>
    </div>

    <div class="controls-hint">
        Use <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> or Arrow Keys to navigate your platform. Mounted systems fire automatically!
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let gameRunning = true;
        let crystals = 30; 
        let currentWave = 1;
        let keys = {};

        const starship = {
            x: 275, y: 350, w: 50, h: 50, speed: 5, hp: 100,
            weapons: {
                gatling: { lvl: 0, cost: 50, lastFire: 0, cd: 400 },
                flak: { lvl: 0, cost: 120, lastFire: 0, cd: 1200 },
                emp: { lvl: 0, cost: 200, lastFire: 0, cd: 2000 }
            }
        };

        let projectiles = [];
        let enemies = [];
        let items = [];
        let animations = [];

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function buyWeapon(type) {
            let wp = starship.weapons[type];
            if (crystals >= wp.cost) {
                crystals -= wp.cost;
                wp.lvl++;
                wp.cost = Math.floor(wp.cost * 1.6);
                
                if (type === 'gatling') wp.cd = Math.max(150, wp.cd - 60);
                if (type === 'flak') wp.cd = Math.max(600, wp.cd - 150);
                
                updateShopUI();
            }
        }

        function updateShopUI() {
            document.getElementById('crystalCount').innerText = crystals;
            document.getElementById('hpText').innerText = `${starship.hp}%`;
            document.getElementById('waveText').innerText = currentWave;

            let g = starship.weapons.gatling;
            document.getElementById('gatlingDesc').innerText = g.lvl > 0 ? `Level ${g.lvl} / Rate: ${(1000/g.cd).toFixed(1)}/s` : "Unmounted";
            document.getElementById('btnGatling').innerText = g.lvl > 0 ? `Upgrade: ${g.cost}` : `Mount: ${g.cost}`;
            document.getElementById('btnGatling').disabled = crystals < g.cost;

            let f = starship.weapons.flak;
            document.getElementById('flakDesc').innerText = f.lvl > 0 ? `Level ${f.lvl} / Splash: ${40 + f.lvl*10}px` : "Unmounted";
            document.getElementById('btnFlak').innerText = f.lvl > 0 ? `Upgrade: ${f.cost}` : `Mount: ${f.cost}`;
            document.getElementById('btnFlak').disabled = crystals < f.cost;

            let e = starship.weapons.emp;
            document.getElementById('empDesc').innerText = e.lvl > 0 ? `Level ${e.lvl} / Targets: ${1 + e.lvl}` : "Unmounted";
            document.getElementById('btnEmp').innerText = e.lvl > 0 ? `Upgrade: ${e.cost}` : `Mount: ${e.cost}`;
            document.getElementById('btnEmp').disabled = crystals < e.cost;
        }

        function spawnWave() {
            if (!gameRunning) return;
            let count = 4 + currentWave * 3;
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    enemies.push({
                        x: Math.random() * (canvas.width - 30),
                        y: -30, w: 26, h: 26,
                        hp: 15 + currentWave * 8,
                        maxHp: 15 + currentWave * 8,
                        speed: 1.2 + Math.random() * 1.5,
                        type: Math.random() > 0.75 ? 'heavy' : 'scout'
                    });
                }, i * 600);
            }
            setTimeout(() => {
                if (gameRunning) {
                    currentWave++;
                    spawnWave();
                }
            }, 15000 + count * 600);
        }

        function findClosestEnemy(src, range) {
            let closest = null;
            let minDist = range;
            enemies.forEach(e => {
                let d = Math.hypot(e.x - src.x, e.y - src.y);
                if (d < minDist) {
                    minDist = d;
                    closest = e;
                }
            });
            return closest;
        }

        function update() {
            if (keys['KeyA'] || keys['ArrowLeft']) if (starship.x > 0) starship.x -= starship.speed;
            if (keys['KeyD'] || keys['ArrowRight']) if (starship.x < canvas.width - starship.w) starship.x += starship.speed;
            if (keys['KeyW'] || keys['ArrowUp']) if (starship.y > 0) starship.y -= starship.speed;
            if (keys['KeyS'] || keys['ArrowDown']) if (starship.y < canvas.height - starship.h) starship.y += starship.speed;

            let now = Date.now();

            if (starship.weapons.gatling.lvl > 0 && now - starship.weapons.gatling.lastFire > starship.weapons.gatling.cd) {
                let target = findClosestEnemy(starship, 300);
                if (target) {
                    let angle = Math.atan2(target.y - starship.y, target.x - starship.x);
                    projectiles.push({
                        x: starship.x + starship.w/2, y: starship.y + 10,
                        vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7,
                        type: 'plasma', dmg: 8 + starship.weapons.gatling.lvl * 2, rad: 3
                    });
                    starship.weapons.gatling.lastFire = now;
                }
            }
