<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ship Guardian </title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            overflow: hidden;
        }
        h1 {
            color: #06b6d4;
            font-size: 2rem;
            margin: 0 0 15px 0;
            text-shadow: 0 0 10px rgba(6,182,212,0.4);
        }
        #gameInterface {
            display: flex;
            gap: 20px;
            background-color: #111827;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #1f2937;
        }
        #spaceField {
            position: relative;
            width: 500px;
            height: 500px;
            background-color: #090d16;
            border: 2px solid #374151;
            border-radius: 8px;
            overflow: hidden;
        }
        #playerShip {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #06b6d4;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 0 15px #06b6d4;
            transition: background-color 0.1s;
        }
        .wing-mount {
            position: absolute;
            width: 10px;
            height: 12px;
            background-color: #a855f7;
            top: 20px;
        }
        #leftWing { left: -10px; border-radius: 4px 0 0 4px; }
        #rightWing { right: -10px; border-radius: 0 4px 4px 0; }
        .enemy {
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #ef4444;
            border-radius: 4px;
            box-shadow: 0 0 8px #ef4444;
        }
        .laser {
            position: absolute;
            width: 6px;
            height: 12px;
            background-color: #22c55e;
            border-radius: 3px;
            box-shadow: 0 0 8px #22c55e;
        }
        #controlBay {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stat-panel {
            background-color: #1f2937;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            font-size: 0.95rem;
        }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .stat-val { font-weight: bold; }
        .upgrade-btn {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .upgrade-btn:hover:not(:disabled) { background-color: #2563eb; }
        .upgrade-btn:disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; }
        #gameOverOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(3, 7, 18, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>🚀 STARSHIP GUARDIAN MATRIX</h1>

    <div id="gameInterface">
        <div id="spaceField">
            <div id="playerShip">
                <div id="leftWing" class="wing-mount" style="display:none;"></div>
                <div id="rightWing" class="wing-mount" style="display:none;"></div>
            </div>
            
            <div id="gameOverOverlay">
                <h2 style="color:#ef4444; font-size:1.8rem; margin-bottom:5px;">CORE CRITICAL</h2>
                <p style="color:#9ca3af; margin-bottom:20px;">Command Ship Destroyed</p>
                <button class="upgrade-btn" style="width:150px;" onclick="window.location.reload()">REDEPLOY</button>
            </div>
        </div>

        <div id="controlBay">
            <div class="stat-panel">
                <div class="stat-line"><span>Crystals:</span><span id="txtCrystals" class="stat-val" style="color:#eab308;">30</span></div>
                <div class="stat-line"><span>Hull Integrity:</span><span id="txtHP" class="stat-val" style="color:#ef4444;">100%</span></div>
                <div class="stat-line"><span>Sector Wave:</span><span id="txtWave" class="stat-val" style="color:#22c55e;">1</span></div>
            </div>

            <button class="upgrade-btn" id="btnGatling" onclick="upgradeWeapon('gatling')">Mount Gatling (Cost: 30)</button>
            <button class="upgrade-btn" id="btnFlak" onclick="upgradeWeapon('flak')">Mount Flak (Cost: 75)</button>
            <button class="upgrade-btn" id="btnHull" onclick="upgradeWeapon('hull')">Reinforce Hull (Cost: 40)</button>
            
            <p style="font-size:0.8rem; color:#6b7280; margin-top:auto; text-align:center;">
                Move ship with <span style="background:#1f2937; padding:2px 4px; border-radius:4px;">W A S D</span> or <span style="background:#1f2937; padding:2px 4px; border-radius:4px;">Arrows</span>.<br>Weapons track targets automatically.
            </p>
        </div>
    </div>

    <script>
        const field = document.getElementById('spaceField');
        const shipEl = document.getElementById('playerShip');
        
        let state = {
            running: true, crystals: 30, hp: 100, wave: 1,
            ship: { x: 230, y: 380, speed: 6 },
            weapons: { gatling: 0, flak: 0 },
            costs: { gatling: 30, flak: 75, hull: 40 },
            keys: {}, lastGatling: 0, lastFlak: 0
        };

        let entities = { enemies: [], lasers: [] };

        window.addEventListener('keydown', e => state.keys[e.code] = true);
        window.addEventListener('keyup', e => state.keys[e.code] = false);

        function upgradeWeapon(type) {
            if (state.crystals >= state.costs[type]) {
                state.crystals -= state.costs[type];
                if (type === 'hull') {
                    state.hp = Math.min(100, state.hp + 40);
                    state.costs.hull = Math.floor(state.costs.hull * 1.5);
                } else {
                    state.weapons[type]++;
                    state.costs[type] = Math.floor(state.costs[type] * 1.7);
                    if (type === 'gatling') document.getElementById('leftWing').style.display = 'block';
                    if (type === 'flak') document.getElementById('rightWing').style.display = 'block';
                }
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('txtCrystals').innerText = state.crystals;
            document.getElementById('txtHP').innerText = state.hp + '%';
            document.getElementById('txtWave').innerText = state.wave;
            
            document.getElementById('btnGatling').innerText = state.weapons.gatling > 0 ? `Upgrade Gatling (${state.costs.gatling})` : `Mount Gatling (${state.costs.gatling})`;
            document.getElementById('btnGatling').disabled = state.crystals < state.costs.gatling;
            
            document.getElementById('btnFlak').innerText = state.weapons.flak > 0 ? `Upgrade Flak (${state.costs.flak})` : `Mount Flak (${state.costs.flak})`;
            document.getElementById('btnFlak').disabled = state.crystals < state.costs.flak;
            
            document.getElementById('btnHull').disabled = state.crystals < state.costs.hull;
        }

        function spawnEnemyWave() {
            if (!state.running) return;
            let count = 3 + state.wave * 2;
            for(let i=0; i<count; i++) {
                setTimeout(() => {
                    if (!state.running) return;
                    let el = document.createElement('div');
                    el.className = 'enemy';
                    el.style.left = Math.random() * 470 + 'px';
                    el.style.top = '-30px';
                    field.appendChild(el);
                    entities.enemies.push({ el: el, y: -30, hp: 10 + state.wave * 5 });
                }, i * 800);
            }
            setTimeout(() => {
                if (state.running) { state.wave++; updateUI(); spawnEnemyWave(); }
            }, 12000 + count * 800);
        }

        function loop() {
            if (!state.running) return;

            // Handle Starship Movement
            if (state.keys['KeyA'] || state.keys['ArrowLeft']) state.ship.x = Math.max(0, state.ship.x - state.ship.speed);
            if (state.keys['KeyD'] || state.keys['ArrowRight']) state.ship.x = Math.min(460, state.ship.x + state.ship.speed);
            if (state.keys['KeyW'] || state.keys['ArrowUp']) state.ship.y = Math.max(0, state.ship.y - state.ship.speed);
            if (state.keys['KeyS'] || state.keys['ArrowDown']) state.ship.y = Math.min(460, state.ship.y + state.ship.speed);
            
            shipEl.style.left = state.ship.x + 'px';
            shipEl.style.top = state.ship.y + 'px';

            let now = Date.now();

            // Automatic Gatling Turret logic
            if (state.weapons.gatling > 0 && now - state.lastGatling > Math.max(150, 500 - state.weapons.gatling * 80)) {
                if (entities.enemies.length > 0) {
                    let laser = document.createElement('div');
                    laser.className = 'laser';
                    laser.style.left = (state.ship.x + 17) + 'px';
                    laser.style.top = (state.ship.y - 10) + 'px';
                    field.appendChild(laser);
