<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>BattletheBots</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(120deg, #182848 0%, #2980b9 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 24px;
            gap: 30px;
            min-width: 1220px;
        }
        #gameCanvas {
            display: block;
            background: #171c20;
            border: 4px solid #444;
            box-shadow: 0 0 32px #111;
            border-radius: 18px;
            width: 1200px;
            height: 800px;
            max-width: 98vw;
            max-height: 80vw;
        }
        #overlay {
            width: 1200px;
            max-width: 98vw;
            color: #fff;
            font-size: 22px;
            background: rgba(0,0,0,0.15);
            padding: 10px 0;
            border-radius: 0 0 16px 16px;
            text-align: center;
            pointer-events: none;
            user-select: none;
            margin-bottom: 7px;
        }
        #restart {
            display: none;
            padding: 12px 32px;
            font-size: 22px;
            margin-top: 18px;
            border-radius: 10px;
            border: none;
            background: #2980b9;
            color: #fff;
            box-shadow: 0 2px 5px #0008;
            cursor: pointer;
            pointer-events: auto;
        }
        #restart:hover {
            background: #2ecc71;
        }
        #chatBox {
            min-width: 350px;
            color: #fff;
            background: rgba(0,0,0,.4);
            padding: 11px 24px;
            border-radius: 10px;
            font-size: 22px;
            pointer-events: none;
            text-align: center;
            margin: 15px auto 0 auto;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 38px;
            z-index: 2;
        }
        #shopSidebar {
            background: #23293a;
            color: #fff;
            border: 4px solid #1a1e2c;
            border-radius: 18px;
            padding: 36px 30px 30px 30px;
            font-size: 21px;
            box-shadow: 0 0 42px #111b;
            width: 370px;
            max-width: 90vw;
            min-height: 670px;
            margin-top: 0;
            position: relative;
        }
        #shopSidebar h2 {
            margin-top: 0;
            font-size: 26px;
            letter-spacing: 1px;
            color: #6dd5fa;
            text-shadow: 1px 1px 8px #0006;
            text-align: center;
        }
        .shop-upgrade {
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #4446;
        }
        .shop-upgrade:last-child {
            border-bottom: none;
        }
        .shop-btn {
            font-size: 17px;
            border-radius: 7px;
            border: none;
            padding: 7px 20px;
            background: #3f51b5;
            color: #fff;
            margin-right: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .shop-btn:disabled {
            background: #555;
            color: #bbb;
            cursor: default;
        }
        .shop-bought {
            color: #54ef96;
            font-weight: bold;
            font-size: 18px;
            margin-left: 8px;
        }
        #pointsDisplay {
            font-size: 23px;
            text-align: center;
            display: block;
            margin-bottom: 20px;
            color: #ffe082;
            letter-spacing: 1px;
        }
        @media (max-width: 1700px) {
            #container { flex-direction: column; align-items: center;}
            #shopSidebar { width: 95vw; margin-top: 20px;}
            #gameCanvas { width: 98vw !important; height: 65vw !important; max-width: 1200px; max-height: 800px;}
        }
    </style>
</head>
<body>
    <div id="overlay">
        <span id="score"></span><br>
        <span id="meta"></span><br>
        <span id="controls" style="font-size:15px;color:#bbf;">Move: WASD / Arrows   Shoot: Mouse   Switch Weapons: 1-3</span><br>
        <button id="restart">Restart</button>
    </div>
    <div id="chatBox"></div>
    <div id="container">
        <canvas id="gameCanvas" width="1200" height="800"></canvas>
        <div id="shopSidebar">
            <h2>Upgrade Shop</h2>
            <span id="pointsDisplay"></span>
            <div id="shopItems"></div>
        </div>
    </div>

    <script>
        // ======= Super Battle Bots =======
        // --- Game State and Globals ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const metaDisplay = document.getElementById('meta');
        const restartBtn = document.getElementById('restart');
        const pointsDisplay = document.getElementById('pointsDisplay');
        let chatTimer = null;
        let permanentBoost = parseInt(localStorage.getItem('boost') || '0');
        let carryPoints = parseInt(localStorage.getItem('carryPoints') || '0');
        let game, keys = {};
        let lastMouseX = canvas.width/2, lastMouseY = canvas.height/2;
        let mouseDown = false;

        function rand(a, b) { return Math.random() * (b - a) + a; }

        class Entity {
            constructor(x, y, r, color) {
                this.x = x; this.y = y; this.r = r; this.color = color;
                this.alive = true;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            distanceTo(e) {
                return Math.hypot(this.x - e.x, this.y - e.y);
            }
        }

        class Player extends Entity {
            constructor() {
                super(canvas.width/2, canvas.height/2, 22, '#46e1fd');
                this.baseSpeed = 3.1 + permanentBoost*0.2;
                this.speed = this.baseSpeed;
                this.reload = 0;
                this.hp = 100 + permanentBoost * 10;
                this.maxHp = this.hp;
                this.autoCannon = false;
                this.autoWeapon = false;
                this.regen = false;
                this.explodingBullets = false;
                this.weapons = [
                    { name: "Pea Shooter", fireRate: 13, bulletSpeed: 8, damage: 17, color: "#3cf" },
                    { name: "Scattergun", fireRate: 27, bulletSpeed: 6, damage: 8, color: "#fc3", spread: 0.34, pellets: 5 },
                    { name: "Laser", fireRate: 6, bulletSpeed: 15, damage: 6, color: "#f3f" }
                ];
                this.currentWeapon = 0;
            }
            update() {
                let dx = (keys['d']||keys['d'].toUpperCase()||keys['ArrowRight']?1:0) - (keys['a']||keys['a'].toUpperCase()||keys['ArrowLeft']?1:0);
                let dy = (keys['s']||keys['s'].toUpperCase()||keys['ArrowDown']?1:0) - (keys['w']||keys['w'].toUpperCase()||keys['ArrowUp']?1:0);
                let mag = Math.hypot(dx, dy);
                if (mag) { this.x += dx/mag*this.speed; this.y += dy/mag*this.speed; }
                this.x = Math.max(this.r, Math.min(canvas.width-this.r, this.x));
                this.y = Math.max(this.r, Math.min(canvas.height-this.r, this.y));
                if (this.reload > 0) this.reload--;
                if (this.regen && this.hp < this.maxHp && game.frameCount % 45 === 0) this.hp += 1;
                
                if (this.autoCannon && game.frameCount % 30 === 0) {
                    let target = null, minDist = 300;
                    for (let r of game.robots) {
                        if (r.alive) {
                            let d = this.distanceTo(r);
                            if (d < minDist) { minDist = d; target = r; }
                        }
                    }
                    if (target) {
                        let angle = Math.atan2(target.y - this.y, target.x - this.x);
                        game.bullets.push(new Bullet(this.x, this.y, Math.cos(angle)*10, Math.sin(angle)*10, this, 10, '#fff', this.explodingBullets));
                    }
                }
            }
            shoot(mx, my) {
                let w = this.weapons[this.currentWeapon];
                if (this.reload === 0) {
                    let angle = Math.atan2(my - this.y, mx - this.x);
                    if (w.name === "Scattergun") {
                        for (let i = 0; i < w.pellets; i++) {
                            let spread = angle + (Math.random() - 0.5) * w.spread;
                            game.bullets.push(new Bullet(this.x, this.y, Math.cos(spread) * w.bulletSpeed, Math.sin(spread) * w.bulletSpeed, this, w.damage, w.color, this.explodingBullets));
                        }
                    } else {
                        game.bullets.push(new Bullet(this.x, this.y, Math.cos(angle) * w.bulletSpeed, Math.sin(angle) * w.bulletSpeed, this, w.damage, w.color, this.explodingBullets));
                    }
                    this.reload = w.fireRate;
                }
            }
            draw() {
                super.draw();
                ctx.fillStyle = "#0f0";
                ctx.fillRect(this.x-22, this.y-34, 44*Math.max(0, this.hp)/this.maxHp, 6);
                ctx.strokeStyle = "#fff";
                ctx.strokeRect(this.x-22, this.y-34, 44, 6);
            }
        }

        class Robot extends Entity {
            constructor(x, y, wave) {
                super(x, y, 18, '#e1a93f');
                this.speed = rand(1.25, 1.7) + wave*0.08;
                this.reload = 0;
