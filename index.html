<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> Another game I guess</title>
  <style>
    body { margin: 0; background: #222; color: #fff; font-family: sans-serif; }
    #gameCanvas { display: block; margin: 0 auto; background: #111; border: 2px solid #444; }
    #overlay { position: absolute; top: 10px; left: 10px; z-index: 2; }
    #restart { display: none; padding: 10px 20px; font-size: 18px; }
  </style>
</head>
<body>
  <div id="overlay">
    <span id="score"></span><br>
    <span id="meta"></span><br>
    <button id="restart">Restart</button>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    // --- Game State ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const metaDisplay = document.getElementById('meta');
    const restartBtn = document.getElementById('restart');

    let permanentBoost = parseInt(localStorage.getItem('boost') || '0');
    let game, keys = {};

    function rand(a, b) { return Math.random() * (b - a) + a; }

    // --- Entities ---
    class Entity {
      constructor(x, y, r, color) {
        this.x = x; this.y = y; this.r = r; this.color = color;
        this.alive = true;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
      distanceTo(e) {
        return Math.hypot(this.x - e.x, this.y - e.y);
      }
    }

    class Player extends Entity {
      constructor() {
        super(canvas.width/2, canvas.height/2, 18, '#3cf');
        this.speed = 3 + permanentBoost;
        this.reload = 0;
        this.hp = 100 + permanentBoost * 10;
        this.maxHp = this.hp;
      }
      update() {
        let dx = (keys['d']||keys['ArrowRight']?1:0) - (keys['a']||keys['ArrowLeft']?1:0);
        let dy = (keys['s']||keys['ArrowDown']?1:0) - (keys['w']||keys['ArrowUp']?1:0);
        let mag = Math.hypot(dx, dy);
        if (mag) { this.x += dx/mag*this.speed; this.y += dy/mag*this.speed; }
        this.x = Math.max(this.r, Math.min(canvas.width-this.r, this.x));
        this.y = Math.max(this.r, Math.min(canvas.height-this.r, this.y));
        if (this.reload > 0) this.reload--;
      }
      shoot(mx, my) {
        if (this.reload === 0) {
          let angle = Math.atan2(my-this.y, mx-this.x);
          game.bullets.push(new Bullet(this.x, this.y, Math.cos(angle)*7, Math.sin(angle)*7, this));
          this.reload = 10;
        }
      }
      draw() {
        super.draw();
        // HP bar
        ctx.fillStyle = "#0f0";
        ctx.fillRect(this.x-20, this.y-28, 40*this.hp/this.maxHp, 5);
      }
    }

    class Robot extends Entity {
      constructor(x, y, wave) {
        super(x, y, 16, '#fa4');
        this.speed = rand(1.2, 1.6) + wave*0.1;
        this.reload = 0;
        this.hp = 25 + wave*7;
        this.maxHp = this.hp;
        this.lastDecision = 0;
        this.target = null;
        this.evadeDir = 0;
      }
      update(aiLevel) {
        if (!this.target || !this.target.alive) this.target = game.player;
        // --- AI: Evasion ---
        let nearestBullet = null, nearestDist = 9999;
        for (let b of game.bullets)
          if (b.owner !== this && b.alive) {
            let d = Math.hypot(b.x-this.x, b.y-this.y);
            if (d < nearestDist && d < 50) { nearestBullet = b; nearestDist = d; }
          }
        if (nearestBullet && Math.random()<0.8) {
          // Dodge perpendicular to bullet
          let perp = Math.atan2(nearestBullet.vy, nearestBullet.vx) + Math.PI/2;
          this.x += Math.cos(perp)*this.speed*1.4;
          this.y += Math.sin(perp)*this.speed*1.4;
        } else if (this.lastDecision < Date.now() - (120-aiLevel*10)) {
          // --- AI: Flank and Pursue ---
          let dx = (this.target.x + Math.sin(Date.now()/400 + this.x)*32) - this.x;
          let dy = (this.target.y + Math.cos(Date.now()/400 + this.y)*32) - this.y;
          let mag = Math.hypot(dx, dy);
          if (mag>0) {
            this.x += dx/mag * this.speed;
            this.y += dy/mag * this.speed;
          }
          this.lastDecision = Date.now();
        }
        // --- AI: Shoot if in range and line of sight ---
        if (this.reload === 0 && this.distanceTo(this.target) < 340 && Math.random()<0.85) {
          // Line of sight check (simple: no walls)
          let angle = Math.atan2(this.target.y-this.y, this.target.x-this.x);
          game.bullets.push(new Bullet(this.x, this.y, Math.cos(angle)*6, Math.sin(angle)*6, this));
          this.reload = Math.max(32 - aiLevel * 2, 10);
        } else if (this.reload > 0) this.reload--;
        // Clamp to arena
        this.x = Math.max(this.r, Math.min(canvas.width-this.r, this.x));
        this.y = Math.max(this.r, Math.min(canvas.height-this.r, this.y));
      }
      draw() {
        super.draw();
        ctx.fillStyle = "#f00";
        ctx.fillRect(this.x-16, this.y-25, 32*this.hp/this.maxHp, 4);
      }
    }

    class Bullet extends Entity {
      constructor(x, y, vx, vy, owner) {
        super(x, y, 5, '#fff');
        this.vx = vx; this.vy = vy;
        this.owner = owner;
        this.life = 60;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.life--;
        if (this.x<0 || this.x>canvas.width || this.y<0 || this.y>canvas.height || this.life<=0)
          this.alive = false;
      }
    }

    // --- Game Logic ---
    function startGame() {
      game = {
        player: new Player(),
        robots: [],
        bullets: [],
        wave: 1,
        score: 0,
        aiLevel: 1,
        nextWave: 0,
        running: true
      };
      restartBtn.style.display = 'none';
      mainLoop();
    }

    function spawnRobots(n, wave) {
      for (let i=0;i<n;i++) {
        let edge = rand(0,4);
        let x = edge<2? (edge===0?0:canvas.width) : rand(60,canvas.width-60);
        let y = edge>=2? (edge===2?0:canvas.height) : rand(60,canvas.height-60);
        game.robots.push(new Robot(x, y, wave));
      }
    }

    function mainLoop() {
      if (!game.running) return;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // Update player
      game.player.update();
      game.player.draw();

      // Update robots
      let aiLevel = Math.min(10, game.wave + permanentBoost);
      for (let r of game.robots) {
        if (r.alive) {
          r.update(aiLevel);
          r.draw();
        }
      }
      // Update bullets
      for (let b of game.bullets) {
        if (b.alive) {
          b.update();
          b.draw();
        }
      }
      // Collisions: bullets vs. robots
      for (let b of game.bullets) if (b.alive) {
        for (let r of game.robots) if (r.alive && b.owner !== r) {
          if (r.distanceTo(b) < r.r+b.r) {
            r.hp -= 20;
            b.alive = false;
            if (r.hp <= 0) {
              r.alive = false;
              game.score += 10 + game.wave * 2;
            }
          }
        }
      }
      // Collisions: bullets vs player
      for (let b of game.bullets) if (b.alive && b.owner !== game.player) {
        if (game.player.distanceTo(b) < game.player.r+b.r) {
          game.player.hp -= 15;
          b.alive = false;
        }
      }
      // Robots touch player
      for (let r of game.robots) if (r.alive) {
        if (game.player.distanceTo(r) < (game.player.r + r.r)) {
          game.player.hp -= 0.7;
        }
      }
      // Remove dead bullets/robots
      game.bullets = game.bullets.filter(b=>b.alive);
      game.robots = game.robots.filter(r=>r.alive);

      // Next wave
      if (Date.now() > game.nextWave && game.robots.length < Math.min(5 + game.wave, 25)) {
        spawnRobots(1 + Math.floor(game.wave/2), game.wave);
        game.wave++;
        game.nextWave = Date.now() + 3600 - game.wave*10;
      }

      // Draw UI
      scoreDisplay.textContent = `Score: ${game.score}  Wave: ${game.wave}  HP: ${Math.ceil(game.player.hp)}`;
      metaDisplay.textContent = `Permanent Boost: +${permanentBoost}  (Earn more by reaching higher waves!)`;

      // Game over
      if (game.player.hp <= 0) {
        game.running = false;
        restartBtn.style.display = 'inline-block';
        // Meta-progression: save best wave as permanent boost
        if (game.wave-1 > permanentBoost) {
          permanentBoost = game.wave-1;
          localStorage.setItem('boost', permanentBoost.toString());
          metaDisplay.textContent = `Permanent Boost Upgraded! +${permanentBoost}`;
        }
        scoreDisplay.textContent = `GAME OVER. Final Score: ${game.score}  Wave: ${game.wave}`;
      } else {
        requestAnimationFrame(mainLoop);
      }
    }

    // --- Controls ---
    window.addEventListener('keydown', e=>keys[e.key]=true);
    window.addEventListener('keyup', e=>keys[e.key]=false);
    canvas.addEventListener('mousedown', e=>{
      let rect = canvas.getBoundingClientRect();
      let mx = e.clientX - rect.left;
      let my = e.clientY - rect.top;
      if (game && game.running) game.player.shoot(mx, my);
    });
    restartBtn.onclick = startGame;

    // --- Start ---
    startGame();
  </script>
</body>
</html>
